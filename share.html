<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>对话分享 · TinyChat</title>
<meta name="description" content="TinyChat 对话分享页：公开的 AI 对话快照，支持 Markdown、代码高亮、公式与图表渲染。TinyChat 是纯 PHP + SQLite 的自托管 AI 站点系统，支持多模型对话与 AI 生图。">
<meta name="robots" content="index,follow">
<meta property="og:type" content="article">
<meta property="og:site_name" content="TinyChat">
<meta property="og:title" content="对话分享 · TinyChat">
<meta property="og:description" content="公开的 AI 对话快照，由 TinyChat 生成。">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="./logo-icon.svg">
<link rel="apple-touch-icon" href="./logo-icon.svg">
<link rel="stylesheet" href="/static/css/style.min.css?v=2.3.1">
<link rel="stylesheet" href="/vendor/highlight/github.min.css?v=2.3.1" id="hljs-theme">
<link rel="stylesheet" href="/vendor/katex/katex.min.css?v=2.3.1">
<link rel="stylesheet" href="/static/css/enhanced.min.css?v=2.3.1">
<link rel="stylesheet" href="/static/css/refine.min.css?v=2.3.1">
<link rel="stylesheet" href="/static/css/redesign.min.css?v=2.3.1">
<link rel="stylesheet" href="/static/css/polish.min.css?v=2.3.1">
<link rel="stylesheet" href="/static/css/markdown.min.css?v=2.3.1">
<link rel="stylesheet" href="/static/css/chrome.min.css?v=2.3.1">
<script src="/static/js/theme-boot.min.js?v=2.3.1"></script>
<!-- 性能门控:按后台设置决定是否加载渲染依赖(markdown-it 始终加载;KaTeX/highlight 可关) -->
<script src="/static/js/perf.min.js?v=2.3.1"></script>
</head>
<body class="share-page">
  <header class="share-top">
    <a class="share-brand" href="/">
      <img src="/logo.svg" class="brand-logo-light" alt="TinyChat">
      <img src="/logo-dark.svg" class="brand-logo-dark" alt="TinyChat">
    </a>
    <a class="btn small" href="/">打开应用</a>
  </header>
  <main class="share-main" id="share-root">
    <p class="muted">正在加载分享…</p>
  </main>
  <script defer src="/static/js/config.min.js?v=2.3.1"></script>
  <script defer src="/static/js/icons.min.js?v=2.3.1"></script>
  <script defer src="/static/js/renderer.min.js?v=2.3.1"></script>
  <script defer src="/static/js/preview.min.js?v=2.3.1"></script>
  <script defer src="/static/js/office-formula-copy.min.js?v=2.3.1"></script>
  <script>
    (function () {
      const LOGO = '<img src="/logo.svg" class="brand-logo-light avatar-logo-img" alt="">'
        + '<img src="/logo-dark.svg" class="brand-logo-dark avatar-logo-img" alt="">';
      const root = document.getElementById('share-root');

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }
      function showError(title, detail) {
        document.title = title;
        const icon = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">'
          + '<path d="M9.5 14.5l5-5" stroke-linecap="round"/>'
          + '<path d="M13.6 6.4l1.8-1.8a3.5 3.5 0 015 5l-2.3 2.3M10.4 17.6l-1.8 1.8a3.5 3.5 0 01-5-5l2.3-2.3" stroke-linecap="round"/>'
          + '<path d="M4 4l16 16" stroke-linecap="round"/></svg>';
        root.innerHTML = '<div class="share-error"><div class="share-error-icon">' + icon + '</div>'
          + '<h1>' + escapeHtml(title) + '</h1><p>' + escapeHtml(detail || '') + '</p>'
          + '<a class="btn small" href="/">返回应用</a></div>';
      }
      function fmtTime(ts) {
        const d = new Date(Number(ts) || Date.now());
        if (Number.isNaN(d.getTime())) return '';
        const p = (n) => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
      }

      const id = (location.pathname.match(/^\/s\/([A-Za-z0-9]+)/) || [])[1];
      if (!id) return showError('分享不存在', '链接无效。');

      function whenReady(fn) {
        if (window.OCRenderer || document.readyState === 'complete') return fn();
        window.addEventListener('load', fn, { once: true });
      }
      function start() {
      fetch((window.apiUrl ? window.apiUrl('/api/shares/' + id) : '/api/shares/' + id))
        .then(async (r) => {
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error((data.error && data.error.message) || '分享不存在或已失效');
          return data.share;
        })
        .then((share) => whenReady(() => {
          const msgs = Array.isArray(share.messages) ? share.messages : [];
          document.title = (share.title || '对话分享') + ' · TinyChat';
          const ogTitle = document.querySelector('meta[property="og:title"]');
          if (ogTitle) ogTitle.setAttribute('content', document.title);
          const ogDesc = document.querySelector('meta[property="og:description"]');
          if (ogDesc) {
            const first = msgs.find((msg) => msg && String(msg.content || '').trim());
            ogDesc.setAttribute('content', first
              ? String(first.content).replace(/\s+/g, ' ').slice(0, 120)
              : '公开的 AI 对话快照，由 TinyChat 生成。');
          }
          if (!msgs.length) {
            root.innerHTML = '<div class="share-empty">这份分享没有消息。</div>';
            return;
          }
          root.innerHTML = '<h1 class="share-title">' + escapeHtml(share.title || '未命名对话') + '</h1>'
            + '<p class="share-meta">公开快照 · ' + escapeHtml(fmtTime(share.updatedAt || share.createdAt)) + ' · ' + msgs.length + ' 条消息</p>'
            // 只读快照的自然延伸:把这段对话导入自己的账号继续聊。
            // 未登录时点了会先去登录(带回跳),登录后自动接上这一步。
            + '<div class="share-import"><button type="button" class="btn small primary" id="share-import-btn">复制到我的对话，继续聊</button>'
            + '<span class="muted small" id="share-import-note">会新建一条对话，原分享不受影响</span></div>'
            + '<div class="messages" id="share-msgs"></div>';
          bindImport(share, msgs);
          const box = document.getElementById('share-msgs');
          msgs.forEach((m) => {
            const role = m.role === 'user' ? 'user' : 'assistant';
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.innerHTML = '<div class="msg-avatar avatar-logo">' + LOGO + '</div>';
            const content = document.createElement('div');
            content.className = 'msg-content';
            div.appendChild(content);
            box.appendChild(div);
            // 用户消息的 HTML 按字面显示,与对话页一致;助手回答照常走渲染管线
            const body = m.role === 'user' ? escapeHtml(m.content || '') : (m.content || '');
            if (window.OCRenderer) window.OCRenderer.renderInto(content, body);
            else content.textContent = m.content || '';
          });
        }))
        .catch((e) => showError('无法打开分享', e.message || '分享不存在或已失效'));
      }
      // ---- 复制到我的对话 ----
      // 只建一条普通对话(带来源标记),不写分享、不改别人的数据。导入后跳到首页并打开它,
      // 之后的一切都属于当前账号(选中会话即被当作当前会话,不需要服务端再改状态)。
      function sharesApi(path, opts) {
        return fetch((window.apiUrl ? window.apiUrl(path) : path), opts);
      }
      async function importShare(share, msgs) {
        const token = localStorage.getItem('oc_token') || '';
        if (!token) return false;
        const title = String(share.title || '未命名对话');
        const chat = {
          id: 'si' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          title: (title.length > 40 ? title.slice(0, 40) + '…' : title) + '（来自分享）',
          messages: (msgs || []).map((m) => ({ role: m.role === 'user' ? 'user' : 'assistant', content: String(m.content || ''), createdAt: Date.now() })),
          createdAt: Date.now(),
          updatedAt: Date.now(),
          importedFrom: location.pathname,
        };
        // 服务端保存是「整份列表替换」(带乐观并发):必须先把云端现有会话取下来,
        // 把新会话并进去再推回。只推一条会把云端其余会话删掉。
        const cur = await fetch(window.apiUrl ? window.apiUrl('/api/sync/chats') : '/api/sync/chats', {
          headers: { Authorization: 'Bearer ' + token },
        }).then((x) => (x.ok ? x.json() : null)).catch(() => null);
        if (!cur || !Array.isArray(cur.chats)) return false;
        const list = cur.chats.filter((c) => c && c.id !== chat.id).concat([chat]);
        const r = await fetch(window.apiUrl ? window.apiUrl('/api/sync/chats') : '/api/sync/chats', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ baseRevision: Number(cur.revision) || 0, chats: list }),
        });
        if (r.ok) { localStorage.setItem('oc_chat_imported', chat.id); return true; }
        if (r.status === 409) {
          // 期间云端有别的设备写过:再把最新列表取一次,合并后重试一次。仍失败就交给用户重试,
          // 不在这里循环 —— 多设备同时操作时无限重试只会一直失败。
          const again = await r.json().catch(() => null);
          const latest = again && Array.isArray(again.chats) ? again.chats : null;
          if (!latest) return false;
          const merged = latest.filter((c) => c && c.id !== chat.id).concat([chat]);
          const r2 = await fetch(window.apiUrl ? window.apiUrl('/api/sync/chats') : '/api/sync/chats', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ baseRevision: Number(again.revision) || 0, chats: merged }),
          });
          if (r2.ok) { localStorage.setItem('oc_chat_imported', chat.id); return true; }
        }
        return false;
      }
      function bindImport(share, msgs) {
        const btn = document.getElementById('share-import-btn');
        const note = document.getElementById('share-import-note');
        if (!btn) return;
        const hasToken = !!(localStorage.getItem('oc_token') || '');
        if (!hasToken && note) note.textContent = '登录或注册后即可导入';
        btn.addEventListener('click', async () => {
          if (!localStorage.getItem('oc_token')) {
            location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
            return;
          }
          btn.disabled = true;
          const old = btn.textContent;
          btn.textContent = '正在导入…';
          const ok = await importShare(share, msgs).catch(() => false);
          if (ok) {
            btn.textContent = '已导入，正在打开…';
            location.href = '/';
          } else {
            btn.disabled = false;
            btn.textContent = old;
            if (note) note.textContent = '导入失败：请确认已登录后重试';
          }
        });
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    })();
  </script>
</body>
</html>
